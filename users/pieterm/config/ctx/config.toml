# ctx (agent history search) config. Copied to ~/.ctx/config.toml by install-symlinks
# (ctx rejects a symlinked config). Rerun `install -u` after editing this file.
# Docs: ctx docs show storage

[daemon]

[search]
# Keyword search only. Semantic search needs the daemon and a 1.3 GB model.
semantic = false

[analytics]
enabled = false

[indexing]
# No daemon. `ctx search --refresh wait` updates the index on demand.
mode = "manual"
