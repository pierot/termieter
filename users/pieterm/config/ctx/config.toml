# ctx (agent history search) config. Copied to ~/.ctx/config.toml by install-symlinks
# (ctx rejects a symlinked config). Rerun `install -u` after editing this file.
# Docs: ctx docs show storage

[daemon]

[search]
# Hybrid BM25 + local embeddings (intfloat/multilingual-e5-small). Needs the daemon.
semantic = true

[analytics]
enabled = false

[indexing]
mode = "auto"
