# Resurrect
run-shell ~/.termieter/tmux/tmux-resurrect/resurrect.tmux
set -g @resurrect-strategy-vim "session"
set -g @resurrect-strategy-nvim "session"
set -g @resurrect-capture-pane-contents 'on'
# Default
set -g @resurrect-processes 'tail'

# Auto-save every 6 hours is handled by a launchd agent
# (tmux/be.jackjoe.tmux-resurrect-save.plist + resurrect-save.sh).
# Manual save through the same script: it skips a save with fewer than
# 5 panes. M-s saves without that check.
bind C-s run-shell '~/.termieter/tmux/resurrect-save.sh key'
bind M-s run-shell '~/.termieter/tmux/resurrect-save.sh force'

# Auto-restore once per tmux server. At server start the config loads before
# the first session exists; the hook runs after it exists and removes itself.
if -F '#{==:#{server_sessions},0}' {
  set-hook -g session-created {
    set-hook -gu session-created
    run-shell -b '~/.termieter/tmux/tmux-resurrect/scripts/restore.sh'
  }
}

set-window-option -g window-status-current-style bg=maroon

# Send modified keys as CSI u, the format pi and Neovim expect.
set -g extended-keys-format csi-u

# Make active pane larger height and keep its vertical position.
bind H run-shell 'TMUX_RESIZE_PERCENT=70 sh ~/.termieter/tmux/resize-half-keep.sh #{pane_id}'
