# Persistent keyboard config. Install with:
#   sudo mkdir -p /etc/X11/xorg.conf.d
#   sudo ln -sf ~/.termieter/users/jeroenb/xorg/00-keyboard.conf \
#       /etc/X11/xorg.conf.d/00-keyboard.conf
#
# X applies this on every keyboard device add, so it survives the udev
# re-trigger that pacman runs after an upgrade, and USB replugs. The equivalent
# lines in ~/.xinitrc are the fallback for machines where this file has not been
# installed yet.
#
# The repeat rate cannot go here: xorg-server 21.1.x has no AutoRepeat option.
# That is handled by /etc/systemd/do-not-udevadm-trigger-on-update instead.

Section "InputClass"
    Identifier "system-keyboard"
    MatchIsKeyboard "on"
    Option "XkbLayout" "us"
    Option "XkbModel" "pc105"
    Option "XkbOptions" "caps:escape_shift_capslock,compose:ralt"
EndSection
